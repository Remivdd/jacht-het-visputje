<title>Jacht Het Visputje</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a4230">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Visputje">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Text:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#f0eee1;
    --surface:#fbfaf3;
    --surface-2:#e9e6d6;
    --ink:#20241a;
    --ink-dim:#5c6150;
    --line:#d7d3bd;
    --accent:#3c5a3f;
    --accent-strong:#2a4230;
    --accent-2:#b5622a;
    --danger:#a33d2f;
    --shadow: 0 6px 20px -8px rgba(20,24,15,.35);
    --font-display:'Big Shoulders Text',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12160e;
      --surface:#1b2016;
      --surface-2:#242a1c;
      --ink:#eae7d8;
      --ink-dim:#a6ab96;
      --line:#333a28;
      --accent:#82b57e;
      --accent-strong:#a3cd9c;
      --accent-2:#e2955f;
      --danger:#e0685a;
      --shadow: 0 6px 24px -8px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12160e;
    --surface:#1b2016;
    --surface-2:#242a1c;
    --ink:#eae7d8;
    --ink-dim:#a6ab96;
    --line:#333a28;
    --accent:#82b57e;
    --accent-strong:#a3cd9c;
    --accent-2:#e2955f;
    --danger:#e0685a;
    --shadow: 0 6px 24px -8px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-tap-highlight-color:transparent;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    height:100vh;
  }
  button{font-family:inherit;-webkit-tap-highlight-color:transparent}

  header{
    flex:0 0 auto;
    padding:10px 14px 8px;
    border-bottom:1px solid var(--line);
    background:var(--surface);
  }
  .titlebar{
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
  }
  h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:22px;
    letter-spacing:.01em;
    margin:0;
    text-transform:uppercase;
    color:var(--accent-strong);
  }
  .subtitle{
    font-size:12px;
    color:var(--ink-dim);
    font-family:var(--font-mono);
  }
  .tabs{
    display:flex;
    gap:6px;
    margin-top:8px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .tab{
    flex:0 0 auto;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--ink);
    padding:7px 12px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    line-height:1.25;
  }
  .tab small{display:block;font-weight:400;color:var(--ink-dim);font-size:10.5px;font-family:var(--font-mono)}
  .tab.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fbfaf3;
  }
  .tab.active small{color:#dfe8dc}

  main{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    overflow:hidden;
    background:
      repeating-linear-gradient(45deg, var(--surface-2) 0 2px, transparent 2px 14px),
      var(--bg);
  }
  #viewport{
    position:absolute;
    inset:0;
    overflow:hidden;
    touch-action:none;
    cursor:grab;
  }
  #viewport.grabbing{cursor:grabbing}
  #world{
    position:absolute;
    left:0;top:0;
    transform-origin:0 0;
    will-change:transform;
  }
  #world svg{display:block}

  .field-shape{
    fill:rgba(0,0,0,0.001);
    stroke:rgba(255,255,255,.4);
    stroke-width:1;
    vector-effect:non-scaling-stroke;
    cursor:pointer;
  }
  .field-shape.has-data{
    stroke:var(--accent-2);
    stroke-width:1.4;
  }
  .field-shape.selected{
    fill:rgba(181,98,42,.22);
    stroke:var(--accent-2);
    stroke-width:2.4;
  }
  .pin-hit{cursor:pointer}
  .drawing-hit{cursor:pointer}

  /* floating controls */
  .fab-col{
    position:absolute;
    right:12px;
    bottom:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
    z-index:20;
    align-items:flex-end;
  }
  .fab{
    width:50px;height:50px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--surface);
    box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    color:var(--ink);
    cursor:pointer;
  }
  .fab.on{background:var(--accent);border-color:var(--accent);color:#fbfaf3}
  .fab svg{width:22px;height:22px}

  .zoom-col{
    position:absolute;
    right:12px;
    top:12px;
    display:flex;
    flex-direction:column;
    gap:6px;
    z-index:20;
  }
  .zbtn{
    width:38px;height:38px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--surface);
    box-shadow:var(--shadow);
    font-size:19px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    line-height:1;
  }

  .status-banner{
    position:absolute;
    top:12px;left:12px;right:64px;
    z-index:20;
    background:var(--surface);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    border-radius:10px;
    padding:9px 12px;
    font-size:13px;
    display:none;
    align-items:center;
    gap:8px;
    justify-content:space-between;
  }
  .status-banner.show{display:flex}
  .status-banner button{
    border:none;background:var(--accent);color:#fff;
    padding:6px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;
    flex:0 0 auto;
  }

  .toolbar{
    position:absolute;
    left:50%;
    bottom:16px;
    transform:translateX(-50%);
    z-index:21;
    background:var(--surface);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    border-radius:12px;
    padding:8px;
    display:none;
    gap:6px;
    align-items:center;
    flex-wrap:wrap;
    max-width:min(92vw,520px);
  }
  .toolbar.show{display:flex}
  .toolbar .opt{
    border:1px solid var(--line);
    background:var(--surface-2);
    border-radius:8px;
    padding:6px 10px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    color:var(--ink);
    display:flex;align-items:center;gap:6px;
  }
  .toolbar .opt.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .swatch{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
  .swatch.active{border-color:var(--ink)}
  .toolbar .sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
  .toolbar .close-tb{
    border:none;background:transparent;color:var(--ink-dim);font-size:18px;cursor:pointer;padding:2px 6px;
  }

  .pin-picker{
    position:absolute;
    right:70px;
    bottom:16px;
    z-index:21;
    background:var(--surface);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    border-radius:12px;
    padding:8px;
    display:none;
    flex-direction:column;
    gap:4px;
    min-width:170px;
  }
  .pin-picker.show{display:flex}
  .pin-picker button{
    display:flex;align-items:center;gap:8px;
    border:none;background:transparent;
    padding:7px 8px;border-radius:8px;
    font-size:13px;font-weight:600;color:var(--ink);
    cursor:pointer;text-align:left;
  }
  .pin-picker button:hover{background:var(--surface-2)}
  .dot{width:14px;height:14px;border-radius:50%;flex:0 0 auto;border:2px solid rgba(0,0,0,.25)}

  .popover{
    position:absolute;
    z-index:22;
    background:var(--surface);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    border-radius:10px;
    padding:8px;
    display:none;
    font-size:12.5px;
    gap:6px;
    flex-direction:column;
    min-width:140px;
  }
  .popover.show{display:flex}
  .popover .del{
    border:none;background:var(--danger);color:#fff;border-radius:6px;padding:6px 8px;font-weight:600;cursor:pointer;
  }
  .popover .lbl{font-weight:600;color:var(--ink)}

  /* bottom sheet */
  #sheet{
    position:absolute;
    left:0;right:0;bottom:0;
    z-index:25;
    background:var(--surface);
    border-top:1px solid var(--line);
    box-shadow:0 -10px 30px -12px rgba(20,24,15,.4);
    border-radius:16px 16px 0 0;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    transform:translateY(105%);
    transition:transform .22s ease;
    max-height:70%;
    overflow-y:auto;
  }
  #sheet.show{transform:translateY(0)}
  .sheet-head{
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;
  }
  .sheet-title{font-family:var(--font-display);font-weight:700;font-size:19px;text-transform:uppercase;color:var(--accent-strong)}
  .sheet-sub{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-dim);margin-top:2px}
  .sheet-close{border:none;background:var(--surface-2);width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--ink)}
  .counters{display:flex;flex-direction:column;gap:10px}
  .counter-row{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface-2);
    border-radius:10px;
    padding:9px 10px;
  }
  .counter-label{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px}
  .counter-icon{width:24px;height:24px;flex:0 0 auto}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{
    width:30px;height:30px;border-radius:8px;border:1px solid var(--line);
    background:var(--surface);font-size:17px;font-weight:700;cursor:pointer;color:var(--ink);
  }
  .stepper .val{
    font-family:var(--font-mono);font-weight:600;font-size:16px;min-width:26px;text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .sheet-note{font-size:11.5px;color:var(--ink-dim);margin-top:10px;line-height:1.5}

  /* legend / info panel */
  #infoToggle{
    position:absolute;left:12px;bottom:16px;z-index:20;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
    border-radius:20px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--ink-dim);cursor:pointer;
  }
  #infoPanel{
    position:absolute;left:12px;bottom:60px;z-index:20;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
    border-radius:12px;padding:12px 14px;font-size:12px;color:var(--ink);
    display:none;max-width:240px;line-height:1.6;
  }
  #infoPanel.show{display:block}
  #infoPanel h3{margin:0 0 6px;font-family:var(--font-display);font-size:14px;text-transform:uppercase;color:var(--accent-strong)}
  .legend-row{display:flex;align-items:center;gap:8px;margin:3px 0}
  .legend-swatch{width:14px;height:14px;border-radius:3px;flex:0 0 auto}

  .toast{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    z-index:30;background:var(--accent-strong);color:#fff;
    padding:9px 14px;border-radius:20px;font-size:12.5px;font-weight:600;
    box-shadow:var(--shadow);
    display:none;
  }
  .toast.show{display:block}

  @media (max-width:480px){
    h1{font-size:19px}
    .fab{width:46px;height:46px}
    #sheet{padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
  }
</style>

<header>
  <div class="titlebar">
    <h1>Jacht Het Visputje</h1>
    <span class="subtitle">Wervik · WBE In Flanders Fields &amp; Harelbeek- en Heulebeekvallei</span>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <div id="viewport">
    <div id="world"></div>
  </div>

  <div class="status-banner" id="locBanner">
    <span id="locBannerText"></span>
    <button id="locBannerBtn">Wissel</button>
  </div>

  <div class="zoom-col">
    <button class="zbtn" id="zoomIn" title="Inzoomen">+</button>
    <button class="zbtn" id="zoomOut" title="Uitzoomen">&minus;</button>

  </div>

  <div class="toolbar" id="drawToolbar">
    <button class="opt" id="optArrow" data-mode="draw-arrow">↗ Pijl</button>
    <button class="opt" id="optDot" data-mode="draw-dot">● Bolletje</button>

    <span class="swatch" style="background:#a33d2f" data-color="#a33d2f"></span>

    <span class="swatch" style="background:#2b5fa3" data-color="#2b5fa3"></span>
    <span class="swatch" style="background:#c98a1c" data-color="#c98a1c"></span>
    <div class="sep"></div>
    <button class="opt" id="closeDraw">Klaar</button>
  </div>

  <div class="pin-picker" id="pinPicker"></div>

  <div class="popover" id="popover"></div>

  <div class="fab-col">
    <button class="fab" id="fabLoc" title="Mijn locatie">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
    <button class="fab" id="fabPin" title="Pin plaatsen">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>
    </button>
    <button class="fab" id="fabDraw" title="Tekenen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21l3.5-1 11-11-2.5-2.5-11 11L3 21z"/><path d="M14 6l4 4"/></svg>
    </button>
  </div>

  <button id="infoToggle">Legende</button>
  <div id="infoPanel">
    <h3>Legende</h3>
    <div class="legend-row"><div class="legend-swatch" style="background:#4d6b50"></div> Veld van de jacht (luchtfoto)</div>
    <div class="legend-row"><div class="legend-swatch" style="background:#9a9a92"></div> Buiten de jacht (grijs)</div>
    <div class="legend-row"><div class="legend-swatch" style="background:var(--accent-2)"></div> Veld met telling ingevuld</div>
    <div class="legend-row" id="lgVijver"></div>
    <div class="legend-row" id="lgPatrijs"></div>
    <div class="legend-row" id="lgVoederton"></div>
    <div class="legend-row" id="lgFasant"></div>
    <div class="legend-row" style="margin-top:6px;color:var(--ink-dim)">Tik een veld aan om hazen, patrijzen en fazanten in te vullen.</div>
  </div>

  <div class="toast" id="toast"></div>

  <div id="sheet">
    <div class="sheet-head">
      <div>
        <div class="sheet-title" id="sheetTitle">Veld</div>
        <div class="sheet-sub" id="sheetSub"></div>
      </div>
      <button class="sheet-close" id="sheetClose">&times;</button>
    </div>
    <div class="counters">
      <div class="counter-row">
        <div class="counter-label"><svg class="counter-icon" id="icoHaas" viewBox="0 0 24 24"></svg> Hazen</div>
        <div class="stepper" data-field="hazen"><button data-d="-1">&minus;</button><span class="val">0</span><button data-d="1">+</button></div>
      </div>
      <div class="counter-row">
        <div class="counter-label"><svg class="counter-icon" id="icoPatrijs" viewBox="0 0 24 24"></svg> Patrijzen</div>
        <div class="stepper" data-field="patrijzen"><button data-d="-1">&minus;</button><span class="val">0</span><button data-d="1">+</button></div>
      </div>
      <div class="counter-row">
        <div class="counter-label"><svg class="counter-icon" id="icoFasant" viewBox="0 0 24 24"></svg> Fazanten (telling)</div>
        <div class="stepper" data-field="fazanten"><button data-d="-1">&minus;</button><span class="val">0</span><button data-d="1">+</button></div>
      </div>
    </div>
    <div class="sheet-note" id="sheetNote"></div>
  </div>
</main>

/* ---------- build territory tabs ---------- */
function buildTabs(){
  const tabs = $('#tabs');
  tabs.innerHTML='';
  Object.keys(TERRITORY_DATA).forEach(id=>{
    const t = TERRITORY_DATA[id];
    const b = document.createElement('button');
    b.className = 'tab' + (id===state.territoryId?' active':'');
    b.innerHTML = id + '<small>'+t.naam+'</small>';
    b.onclick = ()=> switchTerritory(id);
    b.dataset.id = id;
    tabs.appendChild(b);
  });
}

/* ---------- render current territory world ---------- */
function renderWorld(){
  const t = TERRITORY_DATA[state.territoryId];
  world.innerHTML = '';
  world.style.width = t.w+'px';
  world.style.height = t.h+'px';

  const svgns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgns,'svg');
  svg.setAttribute('viewBox','0 0 '+t.w+' '+t.h);
  svg.setAttribute('width', t.w);
  svg.setAttribute('height', t.h);

  const defs = document.createElementNS(svgns,'defs');
  const clip = document.createElementNS(svgns,'clipPath');
  clip.id = 'clip-'+state.territoryId;
  clip.setAttribute('clipPathUnits','userSpaceOnUse');
  t.fields.forEach(f=>{
    const p = document.createElementNS(svgns,'polygon');
    p.setAttribute('points', f.pts);
    clip.appendChild(p);
  });
  defs.appendChild(clip);

  const filter = document.createElementNS(svgns,'filter');
  filter.id = 'grey-'+state.territoryId;
  filter.innerHTML = '<feColorMatrix type="matrix" values="0.28 0.35 0.11 0 0.08  0.28 0.35 0.11 0 0.08  0.28 0.35 0.11 0 0.08  0 0 0 1 0"/>';
  defs.appendChild(filter);
  svg.appendChild(defs);

  const greyG = document.createElementNS(svgns,'g');
  greyG.setAttribute('filter','url(#grey-'+state.territoryId+')');
  const colorG = document.createElementNS(svgns,'g');
  colorG.setAttribute('clip-path','url(#clip-'+state.territoryId+')');

  t.tiles.forEach(tile=>{
    if(!tile.url) return;
    const img1 = document.createElementNS(svgns,'image');
    img1.setAttribute('href', tile.url);
    img1.setAttributeNS('http://www.w3.org/1999/xlink','href', tile.url);
    img1.setAttribute('x',tile.x); img1.setAttribute('y',tile.y);
    img1.setAttribute('width',tile.w); img1.setAttribute('height',tile.h);
    img1.setAttribute('preserveAspectRatio','none');
    greyG.appendChild(img1);

    const img2 = img1.cloneNode();
    colorG.appendChild(img2);
  });
  svg.appendChild(greyG);
  svg.appendChild(colorG);

  const fieldsG = document.createElementNS(svgns,'g');
  fieldsG.id='fieldsG';
  t.fields.forEach(f=>{
    const p = document.createElementNS(svgns,'polygon');
    p.setAttribute('points', f.pts);
    p.setAttribute('class','field-shape');
    p.dataset.id = f.id;
    if(state.fieldsData[f.id] && hasCounts(state.fieldsData[f.id])) p.classList.add('has-data');
    if(f.id===state.selectedFieldId) p.classList.add('selected');
    p.addEventListener('click', (ev)=>{ ev.stopPropagation(); onFieldTap(f.id); });
    fieldsG.appendChild(p);
  });
  svg.appendChild(fieldsG);

  const pinsG = document.createElementNS(svgns,'g'); pinsG.id='pinsG'; svg.appendChild(pinsG);
  const drawG = document.createElementNS(svgns,'g'); drawG.id='drawG'; svg.appendChild(drawG);
  const meG = document.createElementNS(svgns,'g'); meG.id='meG'; svg.appendChild(meG);

  svg.addEventListener('click', onMapTap);

  world.appendChild(svg);

  fitToViewport();
  renderPins();
  renderDrawings();
}

function hasCounts(d){ return (d.hazen||0)+(d.patrijzen||0)+(d.fazanten||0) > 0; }

/* ---------- pan / zoom ---------- */
function applyTransform(){
  world.style.transform = 'translate('+state.tx+'px,'+state.ty+'px) scale('+state.scale+')';
}

function fitToViewport(){
  const t = TERRITORY_DATA[state.territoryId];
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const s = Math.min(vw/t.w, vh/t.h) * 0.96;
  state.minScale = s*0.6;
  state.maxScale = s*10;
  state.scale = s;
  state.tx = (vw - t.w*s)/2;
  state.ty = (vh - t.h*s)/2;
  applyTransform();
}

function clampScaleAround(newScale, cx, cy){
  const t = TERRITORY_DATA[state.territoryId];
  newScale = Math.max(state.minScale, Math.min(state.maxScale, newScale));
  const wx = (cx - state.tx)/state.scale;
  const wy = (cy - state.ty)/state.scale;
  state.tx = cx - wx*newScale;
  state.ty = cy - wy*newScale;
  state.scale = newScale;
  applyTransform();
}

$('#zoomIn').onclick = ()=>{ const r=viewport.getBoundingClientRect(); clampScaleAround(state.scale*1.35, r.width/2, r.height/2); };
$('#zoomOut').onclick = ()=>{ const r=viewport.getBoundingClientRect(); clampScaleAround(state.scale/1.35, r.width/2, r.height/2); };
$('#zoomFit').onclick = fitToViewport;

/* pointer handling: pan, pinch-zoom, tap, arrow-drag */
const pointers = new Map();
let dragMoved = false;
let lastMid = null, lastDist = null;

function screenToWorld(clientX, clientY){
  const r = viewport.getBoundingClientRect();
  const lx = clientX - r.left, ly = clientY - r.top;
  return { x:(lx - state.tx)/state.scale, y:(ly - state.ty)/state.scale, lx, ly };
}

viewport.addEventListener('pointerdown', (e)=>{
  viewport.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
  dragMoved = false;
  if(pointers.size===1){
    if(state.mode==='draw-arrow'){
      const w = screenToWorld(e.clientX,e.clientY);
      state.arrowStart = w;
      startArrowPreview(w);
    } else {
      viewport.classList.add('grabbing');
    }
  }
});

viewport.addEventListener('pointermove', (e)=>{
  if(!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX,y:e.clientY});

  if(pointers.size===2){
    const pts = [...pointers.values()];
    const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    const mid = {x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2};
    const r = viewport.getBoundingClientRect();
    if(lastDist!=null){
      const factor = dist/lastDist;
      clampScaleAround(state.scale*factor, mid.x-r.left, mid.y-r.top);
    }
    lastDist = dist; lastMid = mid;
    dragMoved = true;
    return;
  }

  const dx = e.clientX-prev.x, dy = e.clientY-prev.y;
  if(Math.abs(dx)>3||Math.abs(dy)>3) dragMoved = true;

  if(state.mode==='draw-arrow' && state.arrowStart){
    const w = screenToWorld(e.clientX,e.clientY);
    updateArrowPreview(state.arrowStart, w);
    return;
  }

  state.tx += dx; state.ty += dy;
  applyTransform();
});

function endPointer(e){
  pointers.delete(e.pointerId);
  lastDist=null; lastMid=null;
  viewport.classList.remove('grabbing');
  if(state.mode==='draw-arrow' && state.arrowStart){
    const w = screenToWorld(e.clientX,e.clientY);
    finishArrow(state.arrowStart, w);
    state.arrowStart = null;
  }
}
viewport.addEventListener('pointerup', endPointer);
viewport.addEventListener('pointercancel', endPointer);

viewport.addEventListener('wheel', (e)=>{
  e.preventDefault();
  const r = viewport.getBoundingClientRect();
  const factor = Math.pow(1.0016, -e.deltaY);
  clampScaleAround(state.scale*factor, e.clientX-r.left, e.clientY-r.top);
},{passive:false});

function onMapTap(e){
  if(dragMoved) return;
  if(e.target.closest('.field-shape')) return;
  if(e.target.closest('.pin-hit')) return;
  if(e.target.closest('.drawing-hit')) return;
  const w = screenToWorld(e.clientX, e.clientY);
  hidePopover();

  if(state.mode.startsWith('pin-')){
    const type = state.mode.slice(4);
    addPin(type, w.x, w.y);
    setMode('view');
    return;
  }
  if(state.mode==='draw-dot'){
    addDrawing('dot',[[w.x,w.y]]);
    return;
  }
  closeSheet();
}

/* ---------- arrow drawing preview ---------- */
function startArrowPreview(start){
  const svgns='http://www.w3.org/2000/svg';
  const g = document.getElementById('drawG');
  const line = document.createElementNS(svgns,'line');
  line.setAttribute('x1',start.x); line.setAttribute('y1',start.y);
  line.setAttribute('x2',start.x); line.setAttribute('y2',start.y);
  line.setAttribute('stroke', state.drawColor);
  line.setAttribute('stroke-width', 4);
  line.setAttribute('stroke-linecap','round');
  line.setAttribute('opacity','0.6');
  line.setAttribute('vector-effect','non-scaling-stroke');
  g.appendChild(line);
  state.arrowPreview = line;
}
function updateArrowPreview(start,end){
  if(!state.arrowPreview) return;
  state.arrowPreview.setAttribute('x2',end.x);
  state.arrowPreview.setAttribute('y2',end.y);
}
function finishArrow(start,end){
  if(state.arrowPreview){ state.arrowPreview.remove(); state.arrowPreview=null; }
  const d = Math.hypot(end.x-start.x, end.y-start.y);
  if(d < 4/state.scale) return;
  addDrawing('arrow',[[start.x,start.y],[end.x,end.y]]);
}

/* ---------- territory switch ---------- */
function switchTerritory(id){
  if(id===state.territoryId) return;
  state.territoryId = id;
  state.selectedFieldId = null;
  closeSheet();
  document.querySelectorAll('.tab').forEach(b=> b.classList.toggle('active', b.dataset.id===id));
  subscribeTerritoryCollections();
  renderWorld();
}

/* ---------- local storage wiring (standalone versie) ---------- */
function lsGet(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function lsSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){ console.warn('opslaan mislukt', e); }
}
let allPins = [];
let allDrawings = [];

function initDb(){
  state.fieldsData = lsGet('visputje_fields', {});
  allPins = lsGet('visputje_pins', []);
  allDrawings = lsGet('visputje_drawings', []);
  document.querySelectorAll('.field-shape').forEach(p=>{
    const fd = state.fieldsData[p.dataset.id];
    p.classList.toggle('has-data', !!(fd && hasCounts(fd)));
  });
  if(state.selectedFieldId) fillSheetFromData(state.selectedFieldId);
  subscribeTerritoryCollections();
}

function subscribeTerritoryCollections(){
  state.pins = allPins.filter(p=>p.territory===state.territoryId);
  state.drawings = allDrawings.filter(d=>d.territory===state.territoryId);
  renderPins();
  renderDrawings();
}

function addPin(type,x,y){
  const pin = {id:'p'+Date.now()+Math.random().toString(36).slice(2,7), type, territory: state.territoryId, x, y, createdAt: new Date().toISOString()};
  allPins.push(pin);
  lsSet('visputje_pins', allPins);
  subscribeTerritoryCollections();
  toast(PIN_TYPES[type].label+' geplaatst');
}

function addDrawing(type, points){
  const d = {id:'d'+Date.now()+Math.random().toString(36).slice(2,7), type, territory: state.territoryId, points, color: state.drawColor, createdAt: new Date().toISOString()};
  allDrawings.push(d);
  lsSet('visputje_drawings', allDrawings);
  subscribeTerritoryCollections();
}

function deletePin(id){ allPins = allPins.filter(p=>p.id!==id); lsSet('visputje_pins', allPins); subscribeTerritoryCollections(); hidePopover(); }
function deleteDrawing(id){ allDrawings = allDrawings.filter(d=>d.id!==id); lsSet('visputje_drawings', allDrawings); subscribeTerritoryCollections(); hidePopover(); }

/* ---------- render pins & drawings ---------- */
function renderPins(){
  const svgns='http://www.w3.org/2000/svg';
  const g = document.getElementById('pinsG');
  if(!g) return;
  g.innerHTML='';
  const s = Math.max(1, 1/state.scale);
  state.pins.forEach(p=>{
    const meta = PIN_TYPES[p.type] || PIN_TYPES.vijver;
    const grp = document.createElementNS(svgns,'g');
    grp.setAttribute('class','pin-hit');
    grp.setAttribute('transform','translate('+p.x+','+p.y+')');
    const R = 13;
    const circle = document.createElementNS(svgns,'circle');
    circle.setAttribute('r',R); circle.setAttribute('fill',meta.color);
    circle.setAttribute('stroke','#fff'); circle.setAttribute('stroke-width',2);
    circle.setAttribute('vector-effect','non-scaling-stroke');
    grp.appendChild(circle);
    const use = document.createElementNS(svgns,'use');
    use.setAttributeNS('http://www.w3.org/1999/xlink','href','#'+meta.icon);
    use.setAttribute('href','#'+meta.icon);
    use.setAttribute('x',-8); use.setAttribute('y',-8); use.setAttribute('width',16); use.setAttribute('height',16);
    use.setAttribute('fill','#fff'); use.setAttribute('stroke','#fff'); use.setAttribute('stroke-width',0.3);
    grp.appendChild(use);
    grp.style.cursor='pointer';
    grp.addEventListener('click',(ev)=>{ ev.stopPropagation(); showPinPopover(p, ev.clientX, ev.clientY); });
    g.appendChild(grp);
  });
}

function renderDrawings(){
  const svgns='http://www.w3.org/2000/svg';
  const g = document.getElementById('drawG');
  if(!g) return;
  g.innerHTML='';
  state.drawings.forEach(d=>{
    if(d.type==='dot'){
      const [ [x,y] ] = d.points;
      const c = document.createElementNS(svgns,'circle');
      c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',9);
      c.setAttribute('fill',d.color||'#a33d2f'); c.setAttribute('stroke','#fff'); c.setAttribute('stroke-width',2);
      c.setAttribute('vector-effect','non-scaling-stroke');
      c.setAttribute('class','drawing-hit');
      c.style.cursor='pointer';
      c.addEventListener('click',(ev)=>{ ev.stopPropagation(); showDrawingPopover(d, ev.clientX, ev.clientY); });
      g.appendChild(c);
    } else if(d.type==='arrow'){
      const [[x1,y1],[x2,y2]] = d.points;
      const grp = document.createElementNS(svgns,'g');
      grp.setAttribute('class','drawing-hit');
      grp.style.cursor='pointer';
      const line = document.createElementNS(svgns,'line');
      line.setAttribute('x1',x1); line.setAttribute('y1',y1); line.setAttribute('x2',x2); line.setAttribute('y2',y2);
      line.setAttribute('stroke', d.color||'#a33d2f'); line.setAttribute('stroke-width',4);
      line.setAttribute('stroke-linecap','round'); line.setAttribute('vector-effect','non-scaling-stroke');
      grp.appendChild(line);
      const ang = Math.atan2(y2-y1,x2-x1);
      const headLen = 16;
      const hx1 = x2 - headLen*Math.cos(ang-0.4), hy1 = y2 - headLen*Math.sin(ang-0.4);
      const hx2 = x2 - headLen*Math.cos(ang+0.4), hy2 = y2 - headLen*Math.sin(ang+0.4);
      const head = document.createElementNS(svgns,'polygon');
      head.setAttribute('points', x2+','+y2+' '+hx1+','+hy1+' '+hx2+','+hy2);
      head.setAttribute('fill', d.color||'#a33d2f');
      grp.appendChild(head);
      const hit = document.createElementNS(svgns,'line');
      hit.setAttribute('x1',x1); hit.setAttribute('y1',y1); hit.setAttribute('x2',x2); hit.setAttribute('y2',y2);
      hit.setAttribute('stroke','transparent'); hit.setAttribute('stroke-width',22);
      hit.setAttribute('vector-effect','non-scaling-stroke');
      grp.appendChild(hit);
      grp.addEventListener('click',(ev)=>{ ev.stopPropagation(); showDrawingPopover(d, ev.clientX, ev.clientY); });
      g.appendChild(grp);
    }
  });
}

/* ---------- popovers ---------- */
function showPinPopover(p, cx, cy){
  const pop = $('#popover');
  const meta = PIN_TYPES[p.type];
  pop.innerHTML = '<div class="lbl">'+meta.label+'</div><button class="del">Verwijder</button>';
  pop.querySelector('.del').onclick = ()=> deletePin(p.id);
  positionPopover(pop, cx, cy);
}
function showDrawingPopover(d, cx, cy){
  const pop = $('#popover');
  const label = d.type==='arrow' ? 'Pijl' : 'Bolletje';
  pop.innerHTML = '<div class="lbl">'+label+'</div><button class="del">Verwijder</button>';
  pop.querySelector('.del').onclick = ()=> deleteDrawing(d.id);
  positionPopover(pop, cx, cy);
}
function positionPopover(pop, cx, cy){
  const r = viewport.getBoundingClientRect();
  pop.style.left = Math.min(cx - r.left, r.width-150) + 'px';
  pop.style.top = Math.min(cy - r.top, r.height-80) + 'px';
  pop.classList.add('show');
}
function hidePopover(){ $('#popover').classList.remove('show'); }
document.addEventListener('click',(e)=>{ if(!e.target.closest('#popover')) hidePopover(); });

/* ---------- field select / sheet ---------- */
function onFieldTap(id){
  if(state.mode!=='view'){ return; }
  state.selectedFieldId = id;
  document.querySelectorAll('.field-shape').forEach(p=> p.classList.toggle('selected', p.dataset.id===id));
  openSheet(id);
}
function openSheet(id){
  const t = TERRITORY_DATA[state.territoryId];
  const f = t.fields.find(x=>x.id===id);
  $('#sheetTitle').textContent = 'Veld';
  $('#sheetSub').textContent = (f.gewas||'Onbekend gewas') + '  ·  ' + id;
  fillSheetFromData(id);
  $('#sheet').classList.add('show');
}
function fillSheetFromData(id){
  const d = state.fieldsData[id] || {hazen:0,patrijzen:0,fazanten:0};
  ['hazen','patrijzen','fazanten'].forEach(k=>{
    const row = document.querySelector('.stepper[data-field="'+k+'"] .val');
    if(row) row.textContent = d[k]||0;
  });
}
function closeSheet(){
  $('#sheet').classList.remove('show');
  state.selectedFieldId = null;
  document.querySelectorAll('.field-shape.selected').forEach(p=>p.classList.remove('selected'));
}
$('#sheetClose').onclick = closeSheet;

document.querySelectorAll('.stepper button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if(!state.selectedFieldId) return;
    const field = btn.parentElement.dataset.field;
    const d = Number(btn.dataset.d);
    const cur = state.fieldsData[state.selectedFieldId] || {hazen:0,patrijzen:0,fazanten:0};
    const next = Math.max(0, (cur[field]||0) + d);
    cur[field] = next;
    cur.updatedAt = new Date().toISOString();
    state.fieldsData[state.selectedFieldId] = cur;
    lsSet('visputje_fields', state.fieldsData);
    btn.parentElement.querySelector('.val').textContent = next;
    document.querySelectorAll('.field-shape').forEach(p=>{
      const fd = state.fieldsData[p.dataset.id];
      p.classList.toggle('has-data', !!(fd && hasCounts(fd)));
    });
  });
});

/* ---------- pin picker ---------- */
function buildPinPicker(){
  const el = $('#pinPicker');
  el.innerHTML='';
  Object.entries(PIN_TYPES).forEach(([key,meta])=>{
    const b = document.createElement('button');
    b.innerHTML = '<span class="dot" style="background:'+meta.color+'"></span>'+meta.label;
    b.onclick = ()=>{ setMode('pin-'+key); el.classList.remove('show'); toast('Tik op de kaart om '+meta.label.toLowerCase()+' te plaatsen'); };
    el.appendChild(b);
  });
}
$('#fabPin').onclick = ()=>{
  $('#pinPicker').classList.toggle('show');
  $('#drawToolbar').classList.remove('show');
};

/* ---------- draw toolbar ---------- */
$('#fabDraw').onclick = ()=>{
  const tb = $('#drawToolbar');
  if(tb.classList.contains('show')){ setMode('view'); tb.classList.remove('show'); return; }
  tb.classList.add('show');
  $('#pinPicker').classList.remove('show');
  setMode('draw-dot');
  syncDrawToolbarUI();
};
$('#optArrow').onclick = ()=>{ setMode('draw-arrow'); syncDrawToolbarUI(); };
$('#optDot').onclick = ()=>{ setMode('draw-dot'); syncDrawToolbarUI(); };
$('#closeDraw').onclick = ()=>{ setMode('view'); $('#drawToolbar').classList.remove('show'); };
document.querySelectorAll('.swatch').forEach(sw=>{
  sw.addEventListener('click', ()=>{
    state.drawColor = sw.dataset.color;
    document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
    sw.classList.add('active');
  });
});
function syncDrawToolbarUI(){
  $('#optArrow').classList.toggle('active', state.mode==='draw-arrow');
  $('#optDot').classList.toggle('active', state.mode==='draw-dot');
  document.querySelectorAll('.swatch').forEach(s=> s.classList.toggle('active', s.dataset.color===state.drawColor));
}

function setMode(m){
  state.mode = m;
  $('#fabDraw').classList.toggle('on', m.startsWith('draw'));
  $('#fabPin').classList.toggle('on', m.startsWith('pin'));
  viewport.style.cursor = m==='draw-arrow' ? 'crosshair' : (m==='draw-dot' ? 'copy' : 'grab');
}

/* ---------- info / legend panel ---------- */
function buildLegendPanel(){
  const rows = { lgVijver:'vijver', lgPatrijs:'patrijs', lgVoederton:'voederton', lgFasant:'fasant' };
  Object.entries(rows).forEach(([elId,key])=>{

$('#infoToggle').onclick = ()=> $('#infoPanel').classList.toggle('show');

/* ---------- icons in sheet ---------- */

  document.getElementById('icoHaas').innerHTML = '<use href="#ico-haas" xlink:href="#ico-haas" fill="'+getComputedStyle(document.documentElement).getPropertyValue('--accent-2')+'"/>';
  document.getElementById('icoPatrijs').innerHTML = '<use href="#ico-patrijs" xlink:href="#ico-patrijs" fill="'+PIN_TYPES.patrijs.color+'"/>';

/* ---------- toast ---------- */
let toastT=null;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(()=> el.classList.remove('show'), 2200);
}

/* ---------- geolocation ---------- */
function territoryContains(id, lat, lon){
  const bb = TERRITORY_DATA[id].bbox;
  return lat>=bb.latMin && lat<=bb.latMax && lon>=bb.lonMin && lon<=bb.lonMax;
}
function projectLatLon(id, lat, lon){
  const t = TERRITORY_DATA[id];
  const bb = t.bbox;
  const x = (lon - bb.lonMin)/(bb.lonMax-bb.lonMin) * t.w;
  const y = (bb.latMax - lat)/(bb.latMax-bb.latMin) * t.h;
  return {x,y};
}
function updateMeMarker(lat,lon,accM){
  const svgns='http://www.w3.org/2000/svg';
  const g = document.getElementById('meG');
  if(!g) return;
  g.innerHTML='';
  if(!territoryContains(state.territoryId, lat, lon)) return;
  const p = projectLatLon(state.territoryId, lat, lon);
  const mpp = 0.6;
  const accPx = Math.max(6, (accM||15)/mpp);
  const acc = document.createElementNS(svgns,'circle');
  acc.setAttribute('cx',p.x); acc.setAttribute('cy',p.y); acc.setAttribute('r',accPx);
  acc.setAttribute('fill','rgba(43,111,163,.18)'); acc.setAttribute('stroke','rgba(43,111,163,.35)');
  g.appendChild(acc);
  const dot = document.createElementNS(svgns,'circle');
  dot.setAttribute('cx',p.x); dot.setAttribute('cy',p.y); dot.setAttribute('r',9);
  dot.setAttribute('fill','#2b6fa3'); dot.setAttribute('stroke','#fff'); dot.setAttribute('stroke-width',3);
  dot.setAttribute('vector-effect','non-scaling-stroke');
  g.appendChild(dot);
}
function findContainingTerritory(lat,lon){
  return Object.keys(TERRITORY_DATA).find(id=> territoryContains(id,lat,lon));
}
function onGeoUpdate(pos){
  const {latitude:lat, longitude:lon, accuracy} = pos.coords;
  const containing = findContainingTerritory(lat,lon);
  if(containing && containing!==state.territoryId){
    const banner = $('#locBanner');
    $('#locBannerText').textContent = 'Je bevindt je in '+TERRITORY_DATA[containing].naam+' ('+containing+')';
    banner.classList.add('show');
    $('#locBannerBtn').onclick = ()=>{ switchTerritory(containing); banner.classList.remove('show'); };
  } else {
    $('#locBanner').classList.remove('show');
  }
  updateMeMarker(lat,lon,accuracy);
}
function onGeoError(err){
  let msg='Locatie niet beschikbaar.';
  if(err.code===1) msg='Locatietoegang geweigerd. Zet dit aan in je browserinstellingen.';
  if(err.code===3) msg='Locatie duurt te lang, probeer opnieuw.';
  toast(msg);
  $('#fabLoc').classList.remove('on');
  state.watchId=null;
}
$('#fabLoc').onclick = ()=>{
  if(state.watchId){
    navigator.geolocation.clearWatch(state.watchId);
    state.watchId=null;
    $('#fabLoc').classList.remove('on');
    document.getElementById('meG') && (document.getElementById('meG').innerHTML='');
    $('#locBanner').classList.remove('show');
    return;
  }
  if(!('geolocation' in navigator)){ toast('Geolocatie wordt niet ondersteund.'); return; }
  $('#fabLoc').classList.add('on');
  state.watchId = navigator.geolocation.watchPosition(onGeoUpdate, onGeoError, {enableHighAccuracy:true, maximumAge:4000, timeout:20000});
};

/* ---------- resize ---------- */
window.addEventListener('resize', ()=> fitToViewport());

/* ---------- boot ---------- */
buildTabs();
buildPinPicker();
buildLegendPanel();
wireSheetIcons();
renderWorld();
initDb();
</script>
